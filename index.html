<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>עגלה אוטונומית – סימולטור | Auto Wagon Sim</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%226%22 width=%2210%22 height=%226%22 rx=%221%22 fill=%22%23c4a574%22/%3E%3Ccircle cx=%225%22 cy=%2213%22 r=%222%22 fill=%22%23222%22/%3E%3Ccircle cx=%2211%22 cy=%2213%22 r=%222%22 fill=%22%23222%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script async src="./vendor/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<header id="top">
  <div class="brand"><span class="logo"></span><span dir="ltr">Auto<b>Wagon</b></span></div>
  <div class="tbtns">
    <button id="bMech" class="tb" title="מנגנון">⚙ מנגנון</button>
    <button id="bTour" class="tb" title="סיור">🎓</button>
    <button id="bXray" class="tb">X-RAY</button>
    <button id="bCut" class="tb">חתך</button>
    <button id="bLabels" class="tb" title="Labels (L)">🏷 תוויות</button>
    <button id="bHQ" class="tb">HQ</button>
    <button id="bLang" class="tb">EN</button>
    <button id="bMenu" class="tb menu">☰</button>
  </div>
</header>

<aside id="panel">
  <button id="pclose" class="pclose">✕</button>
  <div class="ptabs">
    <button class="ptab on" data-t="drive">הנעה</button>
    <button class="ptab" data-t="sim">סימולציה</button>
    <button class="ptab" data-t="calc">מחשבון</button>
    <button class="ptab" data-t="wire">חיווט</button>
    <button class="ptab" data-t="bom">BOM</button>
  </div>
  <div id="pbody"></div>
</aside>

<div id="dash">
  <div class="dgrid">
    <div class="dcell"><span class="dk" id="dkSpd">מהירות</span><span class="dv" id="dvSpd">0.0</span><span class="du">m/s</span></div>
    <div class="dcell"><span class="dk" id="dkBatt">סוללה</span><span class="dv" id="dvBatt">100</span><span class="du">%</span></div>
    <div class="dcell"><span class="dk" id="dkRange">טווח</span><span class="dv" id="dvRange">—</span><span class="du">km</span></div>
    <div class="dcell"><span class="dk" id="dkCur">זרם</span><span class="dv" id="dvCur">0.0</span><span class="du">A</span></div>
    <div class="dcell"><span class="dk" id="dkTrq">מומנט</span><span class="dv" id="dvTrq">0.0</span><span class="du">N·m</span></div>
    <div class="dcell"><span class="dk" id="dkRpm">סל״ד</span><span class="dv" id="dvRpm">0</span><span class="du">rpm</span></div>
  </div>
  <div id="modeTag">IDLE</div>
</div>

<div id="toast"></div>
<div id="tourCard" class="hidden"></div>
<div id="mechPanel"></div>
<div id="hint"></div>

<div id="start" class="ov show">
  <div class="card hero">
    <div class="logoBig"><span class="logo"></span><span dir="ltr">Auto<b>Wagon</b></span></div>
    <p id="sTag">סימולטור עגלת קמפינג אוטונומית — שתי תצורות הנעה, חיישנים, מעקב וניווט</p>
    <button id="bPlay" class="primary big">התחל</button>
    <div class="row">
      <button id="bLang2" class="ghost">English</button>
      <button id="bHQ2" class="ghost">HQ</button>
    </div>
    <p class="fine" id="sDims">מידות אמבט: 88 × 51 × 35 ס״מ · גלגלים Ø17 × 10 ס״מ</p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
